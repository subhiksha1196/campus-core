# MongoDB + Redis + N Spring Boot application servers behind an nginx load balancer.
#
#   docker compose up -d --build            -> mongo, redis, app1, app2, nginx   (http://localhost:8080)
#   docker compose up -d app3               -> add a third application server (then re-point nginx, see README)
#
# Direct access to each server (for per-server metrics):  app1 :8081, app2 :8082, app3 :8083
#
# Load-balancing method (set in your shell or .env before `up`):
#   LB_DIRECTIVE="least_conn;"                       (default)
#   LB_DIRECTIVE="hash $request_uri consistent;"     (consistent-hash routing, nginx ketama)
#   LB_DIRECTIVE="# round-robin"                     (plain round robin)
# Servers behind nginx:
#   APP_SERVERS="server app1:8080 max_fails=2 fail_timeout=5s; server app2:8080 max_fails=2 fail_timeout=5s;"

x-app: &app
  build: ./backend
  image: sis-backend:latest
  cpus: ${APP_CPUS:-1.0}            # fixed capacity per server, so adding a server adds measurable capacity
  mem_limit: ${APP_MEM:-768m}
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

x-app-env: &app-env
  MONGO_URI: mongodb://mongo:27017/sis
  REDIS_HOST: redis
  SIS_DEMO_PASSWORD: ${SIS_DEMO_PASSWORD:?Set SIS_DEMO_PASSWORD in .env}
  SIS_API_LIMIT: ${SIS_API_LIMIT:-600}      # use 1000000 for load tests (all virtual users share one token)
  SIS_AUTH_LIMIT: ${SIS_AUTH_LIMIT:-20}

services:
  mongo:
    image: mongo:7
    container_name: sis-mongo
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sis-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app1:
    <<: *app
    container_name: sis-app1
    ports: ["8081:8080"]
    environment:
      <<: *app-env
      INSTANCE_ID: app1          # only app1 seeds demo data (two servers seeding at once would race)

  app2:
    <<: *app
    container_name: sis-app2
    ports: ["8082:8080"]
    environment:
      <<: *app-env
      INSTANCE_ID: app2
      SIS_ACADEMIC_SEED_ON_STARTUP: "false"

  app3:
    <<: *app
    container_name: sis-app3
    profiles: ["extra"]
    ports: ["8083:8080"]
    environment:
      <<: *app-env
      INSTANCE_ID: app3
      SIS_ACADEMIC_SEED_ON_STARTUP: "false"

  nginx:
    image: nginx:1.27-alpine
    container_name: sis-nginx
    ports: ["8080:80"]
    depends_on: [app1, app2]
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      LB_DIRECTIVE: ${LB_DIRECTIVE:-least_conn;}
      APP_SERVERS: ${APP_SERVERS:-server app1:8080 max_fails=2 fail_timeout=5s; server app2:8080 max_fails=2 fail_timeout=5s;}

volumes:
  mongo-data:
  redis-data:
